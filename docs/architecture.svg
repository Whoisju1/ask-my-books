<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="ask-my-books architecture: clients, fence, FastAPI and MCP surfaces, the ask_my_books core, SQLite vector store, external models, offline ingest, evals and CI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8698"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c9cdd6; stroke-width: 1.2; }
      .cl { stroke: #6b5bd2; } .cl-fill { fill: #ece8fb; }
      .fe { stroke: #c0392b; } .fe-fill { fill: #fbe5e2; }
      .sv { stroke: #2f6fdb; } .sv-fill { fill: #e3ecfb; }
      .co { stroke: #1f8a5b; } .co-fill { fill: #e0f3ea; }
      .st { stroke: #b8551a; } .st-fill { fill: #fbe9dc; }
      .of { stroke: #6e7681; stroke-dasharray: 5 4; } .of-fill { fill: #eef0f3; }
      .t { fill: #1f2430; font-size: 13.5px; font-weight: 600; }
      .m { fill: #5b6270; font-size: 12px; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #7f8698; stroke-width: 1.7; fill: none; marker-end: url(#head); }
      .dash { stroke-dasharray: 5 4; }
      .lbl { fill: #5b6270; font-size: 11.5px; font-style: italic; }
      .band { fill: #5b6270; font-size: 11px; letter-spacing: .08em; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="700" fill="#fafaf7"/>

  <text class="band" x="300" y="28">CLIENTS</text>
  <text class="band" x="300" y="200">SURFACES</text>
  <text class="band" x="300" y="336">CORE</text>
  <text class="band" x="300" y="490">STORAGE &amp; MODELS</text>
  <text class="band" x="24" y="200">OFFLINE</text>

  <!-- Clients -->
  <rect class="box cl cl-fill" x="300" y="38" width="200" height="66" rx="10"/>
  <text class="t" x="314" y="62">Browser UI</text>
  <text class="m" x="314" y="80">React + Vite · streamed answer</text>
  <text class="m" x="314" y="96">+ cited passages</text>

  <rect class="box cl cl-fill" x="520" y="38" width="190" height="66" rx="10"/>
  <text class="t" x="534" y="62">Any HTTP client</text>
  <text class="m" x="534" y="80">curl, scripts,</text>
  <text class="m" x="534" y="96">the eval runner</text>

  <rect class="box cl cl-fill" x="760" y="38" width="256" height="66" rx="10"/>
  <text class="t" x="774" y="62">MCP host</text>
  <text class="m" x="774" y="80">Claude Desktop or any client</text>
  <text class="m" x="774" y="96">that speaks MCP over stdio</text>

  <!-- Fence -->
  <rect class="box fe fe-fill" x="300" y="136" width="410" height="42" rx="10"/>
  <text class="t" x="314" y="154">Fence</text>
  <text class="m" x="360" y="154">passcode → JWT · per-IP rate limit · max question length</text>
  <text class="m" x="360" y="170">daily spend cap turns /ask off · /search stays free (no LLM call)</text>

  <!-- Surfaces -->
  <rect class="box sv sv-fill" x="300" y="210" width="410" height="104" rx="10"/>
  <text class="t" x="314" y="232">FastAPI service — async, pydantic models</text>
  <text class="m code" x="314" y="254">POST /auth/token   → JWT</text>
  <text class="m code" x="314" y="272">GET  /search?q=    → top-k passages (chapter, text, score)</text>
  <text class="m code" x="314" y="290">POST /ask          → SSE stream: answer tokens, then citations</text>
  <text class="m" x="314" y="306">Every route is a thin adapter over the core — no logic lives here.</text>

  <rect class="box sv sv-fill" x="760" y="210" width="256" height="104" rx="10"/>
  <text class="t" x="774" y="232">MCP server — Python SDK</text>
  <text class="m code" x="774" y="254">tools: search(q, k)</text>
  <text class="m code" x="774" y="272">       ask(q)</text>
  <text class="m" x="774" y="290">Same core, no HTTP in between.</text>
  <text class="m" x="774" y="306">stdio transport; runs locally.</text>

  <!-- Core -->
  <rect class="box co co-fill" x="300" y="346" width="716" height="122" rx="10"/>
  <text class="t code" x="314" y="368">ask_my_books</text>
  <text class="m" x="430" y="368">— the importable package. Every surface and the CLI call into this.</text>

  <rect class="box co" x="314" y="382" width="160" height="74" rx="10"/>
  <text class="t" x="324" y="402">Retriever</text>
  <text class="m" x="324" y="420">embed(q) → top-k</text>
  <text class="m" x="324" y="436">from the store</text>

  <rect class="box co" x="486" y="382" width="190" height="74" rx="10"/>
  <text class="t" x="496" y="402">Answerer</text>
  <text class="m" x="496" y="420">grounded prompt → answer</text>
  <text class="m" x="496" y="436">+ citations; refuses if unsupported</text>

  <rect class="box co" x="688" y="382" width="150" height="74" rx="10"/>
  <text class="t" x="698" y="402">Embedder</text>
  <text class="m" x="698" y="420">one interface;</text>
  <text class="m" x="698" y="436">API or local ONNX</text>

  <rect class="box co" x="850" y="382" width="152" height="74" rx="10"/>
  <text class="t" x="860" y="402">Store</text>
  <text class="m" x="860" y="420">sqlite-vec: insert,</text>
  <text class="m" x="860" y="436">KNN query</text>

  <!-- Storage & models -->
  <rect class="box st st-fill" x="300" y="500" width="290" height="100" rx="10"/>
  <text class="t code" x="314" y="522">index.db — SQLite + sqlite-vec</text>
  <text class="m code" x="314" y="542">chunks(id, chapter, text, hash)</text>
  <text class="m code" x="314" y="558">vec_chunks(id, embedding)   ← vec0</text>
  <text class="m" x="314" y="580">Built offline; shipped inside the container image.</text>

  <rect class="box st st-fill" x="620" y="500" width="180" height="100" rx="10"/>
  <text class="t" x="634" y="522">Embeddings model</text>
  <text class="m" x="634" y="542">hosted API, or small</text>
  <text class="m" x="634" y="558">ONNX model in-process</text>
  <text class="m" x="634" y="580">same model at index and query time</text>

  <rect class="box st st-fill" x="830" y="500" width="186" height="100" rx="10"/>
  <text class="t" x="844" y="522">Answering LLM</text>
  <text class="m" x="844" y="542">hosted API, streaming</text>
  <text class="m" x="844" y="580">only ask() calls it</text>

  <!-- Offline column -->
  <rect class="box of of-fill" x="24" y="210" width="246" height="258" rx="10"/>
  <text class="t" x="38" y="232">Ingest CLI — runs once, offline</text>
  <text class="m code" x="38" y="256">data/  (gitignored manuscript)</text>
  <text class="m" x="38" y="276">↓ loader — read, normalize, split by chapter</text>
  <text class="m" x="38" y="296">↓ chunker — size · overlap · boundaries</text>
  <text class="m" x="38" y="316">↓ embedder — same interface as runtime</text>
  <text class="m" x="38" y="336">↓ store — idempotent on re-run (hash)</text>
  <text class="m" x="38" y="364">Produces index.db. Same core functions</text>
  <text class="m" x="38" y="380">as the service; nothing duplicated.</text>
  <text class="m" x="38" y="404">The manuscript never enters the repo.</text>
  <text class="m" x="38" y="420">Tests run on a small fixture corpus.</text>

  <rect class="box of of-fill" x="24" y="500" width="246" height="100" rx="10"/>
  <text class="t" x="38" y="522">Evals — first-class</text>
  <text class="m code" x="38" y="542">evals/gold.jsonl  (15 Qs + chapter)</text>
  <text class="m" x="38" y="560">runner → search → hit-rate@k</text>
  <text class="m" x="38" y="580">numbers committed to the README</text>

  <!-- CI footer -->
  <rect class="box of of-fill" x="24" y="624" width="992" height="52" rx="10"/>
  <text class="t" x="38" y="646">CI — GitHub Actions on every push</text>
  <text class="m" x="38" y="664">pytest runs the whole core on a tiny fixture corpus, then the Docker image builds. CI never needs the real book or an API key.</text>

  <!-- Arrows -->
  <path class="arrow" d="M400,104 L400,136"/>
  <path class="arrow" d="M615,104 L615,136"/>
  <path class="arrow" d="M505,178 L505,210"/>
  <path class="arrow" d="M888,104 L888,210"/>
  <text class="lbl" x="896" y="160">stdio</text>
  <path class="arrow" d="M505,314 L505,346"/>
  <path class="arrow" d="M888,314 L888,346"/>
  <path class="arrow" d="M926,456 C926,480 460,470 445,500"/>
  <text class="lbl" x="700" y="484">KNN over vec0</text>
  <path class="arrow" d="M763,456 L720,500"/>
  <path class="arrow" d="M640,456 C700,470 880,470 910,500"/>
  <path class="arrow dash" d="M270,300 C290,300 290,419 314,419"/>
  <text class="lbl" x="276" y="366">uses</text>
  <path class="arrow" d="M147,468 C147,485 300,485 300,540"/>
  <text class="lbl" x="196" y="486">writes</text>
  <path class="arrow dash" d="M270,550 C285,550 285,160 300,157"/>
  <text class="lbl" x="200" y="612">calls /search</text>
</svg>
